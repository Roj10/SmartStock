# Perfil "h2": banco em memória, sem Supabase (para testes ou para rodar sem internet).
# Os dados voltam ao exemplo a cada reinício. Uso: java -jar target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=h2
spring.datasource.url=jdbc:h2:mem:smartstock;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# arquivos numa pasta local (backend/armazenamento-local), sem Supabase Storage
app.armazenamento=local
app.armazenamento.local-dir=armazenamento-local
# segredo fixo só para este perfil de testes (sem dados reais); no uso normal ele vem do backend/.env
app.seguranca.segredo=perfil-h2-somente-testes-locais-0123456789abcdef
