# Perfil "h2": banco em memória, sem Supabase (para testes ou para rodar sem internet).
# Os dados voltam ao exemplo a cada reinício. Uso: java -jar target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=h2
spring.datasource.url=jdbc:h2:mem:smartstock;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS smartstock
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# arquivos numa pasta local (backend/armazenamento-local), sem Supabase Storage
app.armazenamento=local
app.armazenamento.local-dir=armazenamento-local
