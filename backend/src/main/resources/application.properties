spring.application.name=SmartStock

server.port=8080

# ---------- Banco de dados: PostgreSQL no Supabase ----------
# A senha NÃO fica aqui (o repositório é público): ela é lida do arquivo backend/.env (ignorado pelo git)
# ou da variável de ambiente SUPABASE_DB_PASSWORD. Veja backend/.env.example.
spring.config.import=optional:file:.env[.properties]

# Conexão pelo "Session pooler" (funciona em redes IPv4). As tabelas ficam no schema "smartstock",
# fora do schema "public", que o Supabase expõe automaticamente pela API REST dele.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require&currentSchema=smartstock}
spring.datasource.username=${SUPABASE_DB_USER:postgres.brlmkluxhgeaavzaojis}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# o plano gratuito aceita poucas conexões simultâneas: 5 bastam para o sistema
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=smartstock
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=U21hcnRTdG9ja0RlbW9TZWNyZXRLZXkyMDI2SEZSTUZyYWlidXJnb1BKQUlJSQ==
jwt.expiration-ms=86400000

# ---------- Arquivos: Supabase Storage ----------
# Fotos dos itens (bucket público "pastilhas"), imagens das conversas (privado "mensagens") e arquivos dos
# projetos (privado "projetos"). Os buckets são criados sozinhos na primeira execução. A chave secreta
# (SUPABASE_SERVICE_KEY) fica no backend/.env, junto com a senha do banco.
app.armazenamento=supabase
app.supabase.url=${SUPABASE_URL:https://brlmkluxhgeaavzaojis.supabase.co}
app.supabase.service-key=${SUPABASE_SERVICE_KEY}
# 20 MB por arquivo (projetos); as imagens de pastilhas e mensagens continuam limitadas a 5 MB no código
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
