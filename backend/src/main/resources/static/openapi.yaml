                imagemUrl: /arquivos/pastilhas/seed-barra-ferro-chata.jpg
                abaixoDoMinimo: false
              - id: 2
                codigo: RDA-PORT-150
                descricao: Roda de portão em ferro fundido 150 mm
                fabricante:
                  id: 3
