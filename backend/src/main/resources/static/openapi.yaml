        A foto vai para o bucket público "pastilhas" do Supabase Storage.


        **Quem pode:** Estoque.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Número (id) do registro
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: Imagem (PNG, JPEG, WEBP ou GIF)
              required:
              - arquivo
      responses:
        '200':
          description: OK.
          content:
            application/json:
              example:
                id: 9
                codigo: CHP-AC-03
                descricao: Chapa de aço carbono 3 mm (1,2 x 3 m)
                fabricante:
                  id: 1
                  nome: Siderúrgica Planalto
                  tipo: FABRICANTE
                  contato: Vendas de aço
