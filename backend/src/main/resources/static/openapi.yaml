        '403':
          $ref: '#/components/responses/Erro403'
  /api/pastilhas/{id}:
    get:
      tags:
      - Itens de estoque
      summary: Buscar um item
      description: '**Quem pode:** Estoque, Movimentações, Progresso ou Fornecedores.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Número (id) do registro
      responses:
        '200':
          description: OK.
          content:
            application/json:
              example:
                id: 1
                codigo: BAR-FE-01
                descricao: Barra de ferro quadrada 1" (barra de 6 m)
                fabricante:
