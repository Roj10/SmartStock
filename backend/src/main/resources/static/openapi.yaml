      summary: Cadastrar item
      description: 'A quantidade informada é o estoque inicial; depois ela só muda por movimentações.


        **Quem pode:** Estoque.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              codigo: CHP-AC-03
              descricao: Chapa de aço carbono 3 mm (1,2 x 3 m)
              fabricanteId: 1
              estoqueMinimo: 5
              quantidadeAtual: 12
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              example:
