                codigo: CHP-AC-03
                descricao: Chapa de aço carbono 3 mm (1,2 x 3 m)
                fabricante:
                  id: 1
                  nome: Siderúrgica Planalto
                  tipo: FABRICANTE
                  contato: Vendas de aço
                  telefone: (47) 3333-1111
                  email: vendas@planalto.example.com
                estoqueMinimo: 6
                quantidadeAtual: 12
                imagemUrl: null
                abaixoDoMinimo: false
        '400':
