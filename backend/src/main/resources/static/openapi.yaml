                  estoqueMinimo: 10
                  quantidadeAtual: 10
                  imagemUrl: /arquivos/pastilhas/seed-dobradica-portao.jpg
                  abaixoDoMinimo: true
                ultimasMovimentacoes: []
        '401':
          $ref: '#/components/responses/Erro401'
  /api/pastilhas:
    get:
      tags:
      - Itens de estoque
      summary: Listar itens
      description: '**Quem pode:** Estoque, Movimentações, Progresso ou Fornecedores.'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              example:
              - id: 1
                codigo: BAR-FE-01
                descricao: Barra de ferro quadrada 1" (barra de 6 m)
                fabricante:
                  id: 1
