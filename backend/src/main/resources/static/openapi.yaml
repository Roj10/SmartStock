# Documentação da API do SmartStock (OpenAPI 3). Aberta no navegador em /swagger-ui.html.
# Os exemplos de resposta foram gerados chamando o sistema de verdade com os dados de exemplo.
openapi: 3.0.3
info:
  title: SmartStock API
  version: '1.0'
  description: 'API do SmartStock: estoque, produção, entregas, financeiro e mensagens de uma metalúrgica.


    **Como usar aqui:** 1) `POST /api/auth/login` com usuário e senha; 2) siga a etapa indicada em `etapa` (2FA com o código
    do app; troca de senha, se pedida); 3) copie o `token` da resposta final, clique em **Authorize** e cole. As outras rotas
    passam a funcionar com as permissões da sua conta.


    Todas as respostas de erro têm o formato `{status, message, timestamp}`. Os exemplos desta página são respostas reais
    do sistema com os dados de exemplo.'
servers:
- url: /
  description: Este servidor
tags:
- name: Autenticação
  description: 'Login em etapas: senha → 2FA (app autenticador) → troca de senha, quando exigida. Só a última etapa entrega
    o token de acesso.'
- name: Painel
  description: Resumo da tela inicial (mostra só o que a conta pode ver).
- name: Itens de estoque
  description: 'Cadastro dos itens (no código chamados de "pastilhas"): código, descrição, fabricante, estoque mínimo/atual
    e foto.'
- name: Movimentações
  description: Entradas e saídas de estoque. Cada movimentação altera a quantidade do item e registra quem fez.
- name: Fornecedores
  description: Fabricantes e fornecedores, e o preço de cada item por fornecedor.
- name: Projetos
  description: Ordem de produção (aba Progresso) e entregas (aba Calendário), com checklist, materiais e arquivos anexados.
- name: Modelos de projeto
  description: Modelos reaproveitáveis de checklist e materiais para criar projetos novos.
- name: Financeiro
  description: 'Valores: preço por fornecedor, valor parado em estoque, custo e margem dos projetos.'
- name: Vendas e planos
  description: Planos (orçamentos) feitos para clientes; ao fechar, viram venda.
- name: Mensagens
  description: Conversa entre as contas (setores), com texto e imagens privadas.
- name: Usuários
  description: Contas, perfis e permissões por aba; redefinição do 2FA.
- name: Segurança
  description: Registro de eventos de segurança (logins, falhas, bloqueios, 2FA, senhas).
security:
- bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags:
      - Autenticação
      summary: 'Etapa 1: usuário e senha'
      description: 'Confere a senha e devolve a próxima etapa (CONFIGURAR_2FA na primeira vez, senão CODIGO_2FA) com um `desafio`
        (token curto, 5 min) para usar nela. Nunca devolve o token de acesso aqui.


        **Quem pode:** Pública.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: admin
              senha: SuaSenha2026
      responses:
        '200':
          description: OK.
          content:
            application/json:
              example:
                etapa: CONFIGURAR_2FA
                desafio: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiI...(token JWT)
                token: null
                username: null
                nome: Administrador
                role: null
                permissoes: null
                codigosRecuperacao: null
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '429':
          $ref: '#/components/responses/Erro429'
  /api/auth/2fa/configurar:
    post:
      tags:
      - Autenticação
      summary: 'Etapa 2 (1ª vez): gerar o QR code do app autenticador'
      description: 'Gera o segredo do 2FA e devolve o QR code (imagem PNG) e a chave para digitar no app, se a câmera não
        funcionar.


        **Quem pode:** Pública (exige o `desafio` da etapa 1).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              desafio: eyJhbGciOiJIUzI1NiJ9...(desafio)
      responses:
        '200':
          description: OK.
          content:
            application/json:
              example:
                qrCode: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAVYAAAFWAQAAAA...(imagem PNG do QR code)
                chave: 3DER TI2F ORYU R6DY ST7W WEVV JPFJ PLS7
                conta: admin
        '401':
          $ref: '#/components/responses/Erro401'
  /api/auth/2fa/ativar:
    post:
      tags:
      - Autenticação
      summary: 'Etapa 2 (1ª vez): confirmar o primeiro código e ativar o 2FA'
      description: 'Confere o código de 6 dígitos do app. Devolve os 8 códigos de recuperação (mostrados uma única vez) e
        a próxima etapa.


        **Quem pode:** Pública (exige o `desafio`).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              desafio: eyJhbGciOiJIUzI1NiJ9...(desafio)
              codigo: '123456'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              example:
                etapa: TROCAR_SENHA
                desafio: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiI...(token JWT)
                token: null
                username: null
                nome: Administrador
                role: null
                permissoes: null
                codigosRecuperacao:
                - xtpk-ak74
                - whhk-2ux8
        '401':
          $ref: '#/components/responses/Erro401'
        '422':
          $ref: '#/components/responses/Erro422'
        '429':
          $ref: '#/components/responses/Erro429'
  /api/auth/2fa/verificar:
    post:
      tags:
      - Autenticação
      summary: 'Etapa 2: código do app (ou código de recuperação)'
      description: 'Aceita o código de 6 dígitos do app (cada um vale uma vez) ou um código de recuperação (formato xxxx-xxxx,
        uso único). Se a conta não precisar trocar a senha, já devolve o token de acesso.


        **Quem pode:** Pública (exige o `desafio`).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              desafio: eyJhbGciOiJIUzI1NiJ9...(desafio)
              codigo: '123456'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              example:
                etapa: CONCLUIDO
                desafio: null
                token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiI...(token JWT)
                username: admin
                nome: Administrador
                role: ADMIN
                permissoes:
                - PASTILHAS
                - FORNECEDORES
                codigosRecuperacao: null
        '401':
          $ref: '#/components/responses/Erro401'
        '422':
          $ref: '#/components/responses/Erro422'
        '429':
          $ref: '#/components/responses/Erro429'
  /api/auth/trocar-senha:
    post:
      tags:
      - Autenticação
      summary: 'Etapa 3: troca obrigatória de senha'
      description: 'Exigida quando a conta usa senha de exemplo ou definida pelo administrador. Senha nova: 8+ caracteres,
        com letras e números, sem conter o nome de usuário. Devolve o token de acesso.


        **Quem pode:** Pública (exige o `desafio`).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              desafio: eyJhbGciOiJIUzI1NiJ9...(desafio)
              novaSenha: Estoque2026forte
      responses:
        '200':
          description: OK.
          content:
            application/json:
              example:
                etapa: CONCLUIDO
                desafio: null
                token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiI...(token JWT)
                username: admin
                nome: Administrador
                role: ADMIN
                permissoes:
                - PASTILHAS
                - FORNECEDORES
                codigosRecuperacao: null
        '401':
          $ref: '#/components/responses/Erro401'
        '422':
          $ref: '#/components/responses/Erro422'
  /api/auth/sair:
    post:
      tags:
      - Autenticação
      summary: Sair (encerra todas as sessões da conta)
      description: 'O token usado (e qualquer outro dessa conta) deixa de valer.


        **Quem pode:** Conta logada.'
      responses:
        '200':
          description: OK.
        '401':
          $ref: '#/components/responses/Erro401'
  /api/dashboard:
    get:
      tags:
      - Painel
      summary: Resumo da tela inicial
      description: 'Totais, itens com estoque crítico e últimas movimentações, conforme as permissões da conta.


        **Quem pode:** Conta logada.'
      responses:
        '200':
