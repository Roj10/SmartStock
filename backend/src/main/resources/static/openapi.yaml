      summary: Remover a foto do item
      description: '**Quem pode:** Estoque.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Número (id) do registro
      responses:
        '200':
          description: OK.
          content:
            application/json:
              example:
                id: 9
                codigo: CHP-AC-03
                descricao: Chapa de aço carbono 3 mm (1,2 x 3 m)
                fabricante:
                  id: 1
                  nome: Siderúrgica Planalto
                  tipo: FABRICANTE
                  contato: Vendas de aço
                  telefone: (47) 3333-1111
                  email: vendas@planalto.example.com
                estoqueMinimo: 6
                quantidadeAtual: 12
                imagemUrl: null
                abaixoDoMinimo: false
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
  /api/movimentacoes:
    get:
      tags:
      - Movimentações
      summary: Listar movimentações
      description: 'Mais recentes primeiro. Filtro opcional por item.


        **Quem pode:** Movimentações.'
      parameters:
      - name: pastilhaId
        in: query
        required: false
        schema:
          type: integer
        description: Só as movimentações deste item
      responses:
        '200':
          description: OK.
          content:
            application/json:
              example: []
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
  /api/movimentacoes/entrada:
