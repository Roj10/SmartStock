        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
  /api/movimentacoes/entrada/lote:
    post:
      tags:
      - Movimentações
      summary: Registrar várias entradas de uma vez (compra geral)
      description: 'Se uma linha falhar, nenhuma é gravada.


        **Quem pode:** Movimentações.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              observacao: Compra geral de novembro
