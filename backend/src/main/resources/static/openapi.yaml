components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso (o `token` da última etapa do login). Vale 8 horas.
  schemas:
    Erro:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
  responses:
    Erro400:
      description: Dados inválidos (campo obrigatório vazio, formato errado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: 400
            message: 'nome: must not be blank'
            timestamp: '2026-11-01T22:10:00Z'
    Erro401:
      description: Sem login, login vencido ou encerrado ("Sair"), ou etapa de login expirada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: 401
            message: Sessão expirada ou inválida. Entre de novo.
            timestamp: '2026-11-01T22:10:00Z'
    Erro403:
      description: A conta não tem permissão para esta aba/ação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: 403
            message: Você não tem permissão para esta ação.
            timestamp: '2026-11-01T22:10:00Z'
    Erro404:
      description: Registro não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: 404
            message: 'Registro não encontrado: 99'
            timestamp: '2026-11-01T22:10:00Z'
    Erro409:
      description: 'Não dá para excluir/alterar: o registro está ligado a outros cadastros.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: 409
            message: 'Não foi possível concluir: este registro está ligado a outros cadastros (movimentações, itens, projetos...).'
            timestamp: '2026-11-01T22:10:00Z'
    Erro422:
      description: 'Regra de negócio recusou (ex.: estoque insuficiente, senha do administrador incorreta, senha fraca).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: 422
            message: 'Estoque insuficiente para a pastilha BAR-FE-01. Disponível: 3'
            timestamp: '2026-11-01T22:10:00Z'
    Erro429:
      description: 'Muitas tentativas erradas seguidas: bloqueio de 15 minutos.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: 429
            message: Muitas tentativas erradas. Tente de novo em 15 minutos.
            timestamp: '2026-11-01T22:10:00Z'
