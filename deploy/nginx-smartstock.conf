# Nginx do SmartStock no servidor (AWS EC2, Ubuntu).
#
# O que o Nginx faz aqui, em palavras simples: ele é a "recepção" do servidor. Quem acessa o endereço do
# servidor fala só com ele (portas 80/443). Ele entrega as telas do sistema (os arquivos do frontend, já
# prontos) e repassa para o backend (que fica escondido em 127.0.0.1:8080) só os pedidos da API.
# Assim a porta 8080 nunca fica aberta para a internet.
#
# Instalação: o script instalar-ec2.sh copia este arquivo para /etc/nginx/sites-available/smartstock.
# HTTPS: depois de apontar um domínio para o Elastic IP, rode
#   sudo certbot --nginx -d seu-dominio.com.br
# e o certbot acrescenta o certificado e o redirecionamento de http para https neste arquivo.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # pasta com o build do frontend (npm run build -> frontend/dist)
    root /opt/smartstock/frontend;
    index index.html;

    # maior arquivo aceito: 20 MB por anexo de projeto, até 20 arquivos de uma vez
    client_max_body_size 100m;

    # não informa a versão do Nginx (menos pistas para quem procura falhas)
    server_tokens off;

    # proteções do navegador para as telas do sistema
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # só carrega scripts e estilos do próprio site; imagens também do Supabase Storage (fotos dos itens)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;

    # API do backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # fotos servidas pelo próprio backend (só no modo de testes "h2") e documentação da API (Swagger)
    location ~ ^/(arquivos/|swagger-ui|v3/api-docs|openapi\.yaml) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # arquivos do frontend com nome versionado (ex.: index-3f2a1b.js) podem ficar em cache por um ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # telas do sistema: qualquer outro endereço (/progresso, /usuarios...) abre o index.html,
    # e o React mostra a tela certa
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
